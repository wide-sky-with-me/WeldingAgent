[project]
name = "pwps-agent"
version = "0.1.0"
description = "LLM-centric pWPS draft generation agent core"
requires-python = ">=3.14"
dependencies = [
    "langchain-openai>=0.3,<0.4",
    "langgraph>=1.0.1",
    "pydantic>=2.13,<3",
]

[project.scripts]
pwps-agent = "pwps_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pwps_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
